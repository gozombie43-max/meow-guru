[extend]
useDefault = true

[allowlist]
description = "Known deterministic notification dedupe and security regression test fixtures"
paths = [
  '''backend/services/__tests__/notificationCenterService\.test\.js''',
  '''backend/tests/security/.*\.test\.js'''
]
regexTarget = "line"
regexes = [
  '''dedupeKey:\s*['"]duplicate-key-1['"]''',
  '''dedupeKey:\s*['"]duplicate-item-1['"]''',
  '''(ingestionKey|battleSelectionKey|quizKey|['"]?Idempotency-Key['"]?):\s*['"][^'"]+['"]'''
]
