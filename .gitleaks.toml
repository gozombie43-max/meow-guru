[extend]
useDefault = true

[allowlist]
description = "Known deterministic notification dedupe test fixture"
paths = [
  '''backend/services/__tests__/notificationCenterService\.test\.js'''
]
regexTarget = "line"
regexes = [
  '''dedupeKey:\s*['"]duplicate-key-1['"]''',
  '''dedupeKey:\s*['"]duplicate-item-1['"]'''
]
