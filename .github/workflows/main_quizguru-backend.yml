# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - quizguru-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-verify.yml'
      - '.github/workflows/main_quizguru-backend.yml'
  workflow_dispatch:

jobs:
  verification:
    uses: ./.github/workflows/ci-verify.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install locked production dependencies
        run: |
          npm ci --workspace backend --workspace @meow/contracts --include-workspace-root=false --omit=dev


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-app
          include-hidden-files: true
          path: |
            backend
            contracts
            node_modules
            package.json
            package-lock.json
            !node_modules/backend
            !backend/.env*
            !backend/node_modules
            !backend/coverage
            !backend/uploads


  deploy:
    runs-on: ubuntu-latest
    needs: [build, verification]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39C048B2FF59452F9613463239824624 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0994BCA96630443BB4B8D46319B867CD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_115D8A1EAFB5485E96F15FA5CD4BB615 }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Resolve database configuration
        shell: bash
        env:
          ACTIONS_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ACTIONS_MONGODB_DB: ${{ vars.MONGODB_DB }}
        run: |
          set -euo pipefail
          resource_group="$(az webapp list --query "[?name=='quizguru-backend'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ] || [ "$resource_group" = "null" ]; then
            echo "::error::Azure Web App quizguru-backend was not found in the logged-in subscription"
            exit 1
          fi
          mongodb_uri="$ACTIONS_MONGODB_URI"
          mongodb_db="$ACTIONS_MONGODB_DB"
          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            mongodb_uri="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_URI'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_DB'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="quizDB"
          fi

          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            echo "::error::MONGODB_URI is missing from both GitHub Actions secrets and Azure Web App settings"
            exit 1
          fi
          echo "::add-mask::$mongodb_uri"
          echo "MONGODB_URI=$mongodb_uri" >> "$GITHUB_ENV"
          echo "MONGODB_DB=$mongodb_db" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$resource_group" >> "$GITHUB_ENV"

      - name: Apply database migrations before release
        run: npm run db:migrate --workspace backend

      - name: Configure Free F1 quiz-only runtime
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --name quizguru-backend \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "RELEASE_ID=$RELEASE_ID" \
              "QUIZ_ONLY_MODE=true" \
              "RUN_EMBEDDED_WORKERS=false" \
              "PROCESS_ROLE=api" \
            --output none
          az webapp config set \
            --name quizguru-backend \
            --resource-group "$RESOURCE_GROUP" \
            --startup-file "npm --workspace backend start" \
            --always-on false \
            --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 'quizguru-backend'
          slot-name: 'Production'
          package: .

      - name: Verify deployed release readiness
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(az webapp show --name quizguru-backend --resource-group "$RESOURCE_GROUP" --query defaultHostName --output tsv)"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "https://$host/health" > health.json && jq -e --arg release "$EXPECTED_RELEASE" '.ok == true and .releaseId == $release' health.json; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed release failed readiness checks; inspect Azure logs before retrying."
          exit 1
      - name: Capture deployment diagnostics on failure
        if: failure()
        run: az webapp log deployment list --name quizguru-backend --resource-group "$RESOURCE_GROUP" --output json
