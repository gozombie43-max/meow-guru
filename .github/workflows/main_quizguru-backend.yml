# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - quizguru-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_quizguru-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: npm install, build, and test
        working-directory: backend
        run: |
          npm ci --workspaces=false
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Block exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block high and critical backend vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high --workspaces=false

  deploy:
    runs-on: ubuntu-latest
    needs: [build, security]
    env:
      MAINTENANCE_WORKER_APP: quizguru-maint-ede848e3
      ATTACHMENT_WORKER_APP: quizguru-attach-ede848e3
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39C048B2FF59452F9613463239824624 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0994BCA96630443BB4B8D46319B867CD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_115D8A1EAFB5485E96F15FA5CD4BB615 }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Resolve database configuration
        shell: bash
        env:
          ACTIONS_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ACTIONS_MONGODB_DB: ${{ vars.MONGODB_DB }}
        run: |
          set -euo pipefail
          resource_group="$(az webapp list --query "[?name=='quizguru-backend'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ] || [ "$resource_group" = "null" ]; then
            echo "::error::Azure Web App quizguru-backend was not found in the logged-in subscription"
            exit 1
          fi
          mongodb_uri="$ACTIONS_MONGODB_URI"
          mongodb_db="$ACTIONS_MONGODB_DB"
          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            mongodb_uri="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_URI'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_DB'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="quizDB"
          fi

          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            echo "::error::MONGODB_URI is missing from both GitHub Actions secrets and Azure Web App settings"
            exit 1
          fi
          echo "::add-mask::$mongodb_uri"
          echo "MONGODB_URI=$mongodb_uri" >> "$GITHUB_ENV"
          echo "MONGODB_DB=$mongodb_db" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$resource_group" >> "$GITHUB_ENV"

      - name: Apply database migrations before release
        run: npm run db:migrate

      - name: Prepare worker Web Apps
        shell: bash
        run: |
          set -euo pipefail
          source_settings="$(az webapp config appsettings list --name quizguru-backend --resource-group "$RESOURCE_GROUP" --output json)"
          settings=()
          while IFS= read -r encoded; do
            setting="$(printf '%s' "$encoded" | base64 --decode)"
            name="$(printf '%s' "$setting" | jq -r '.name')"
            value="$(printf '%s' "$setting" | jq -r '.value')"
            case "$name" in
              RELEASE_ID|MONGODB_URI|MONGODB_DB|NODE_ENV|WORKER_HTTP_HEALTH) ;;
              *) settings+=("$name=$value") ;;
            esac
          done < <(printf '%s' "$source_settings" | jq -r '.[] | @base64')
          settings+=("MONGODB_URI=$MONGODB_URI" "MONGODB_DB=$MONGODB_DB" "NODE_ENV=production" "WORKER_HTTP_HEALTH=true")

          for worker in "$MAINTENANCE_WORKER_APP|npm run start:worker" "$ATTACHMENT_WORKER_APP|npm run start:attachments"; do
            app_name="${worker%%|*}"
            startup_command="${worker#*|}"
            if ! az webapp show --name "$app_name" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "::error::Worker Web App $app_name is not provisioned or the deployment identity cannot access it"
              exit 1
            fi
            az webapp config appsettings set --name "$app_name" --resource-group "$RESOURCE_GROUP" --settings "${settings[@]}" --output none
            az webapp config set --name "$app_name" --resource-group "$RESOURCE_GROUP" --startup-file "$startup_command" --always-on true --output none
          done

      - name: Deploy maintenance worker
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.MAINTENANCE_WORKER_APP }}
          package: .

      - name: Deploy attachment worker
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.ATTACHMENT_WORKER_APP }}
          package: .

      - name: Activate and verify worker release
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          for app_name in "$MAINTENANCE_WORKER_APP" "$ATTACHMENT_WORKER_APP"; do
            az webapp config appsettings set --name "$app_name" --resource-group "$RESOURCE_GROUP" --settings "RELEASE_ID=$RELEASE_ID" --output none
          done
          for attempt in $(seq 1 30); do
            if node scripts/check-workers.js; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Workers did not become healthy within five minutes"
          exit 1

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'quizguru-backend'
          slot-name: 'Production'
          package: .
