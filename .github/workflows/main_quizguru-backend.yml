# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - quizguru-backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_quizguru-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: npm install, build, and test
        working-directory: backend
        run: |
          npm ci --workspaces=false
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Block exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block high and critical backend vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high --workspaces=false

  deploy:
    runs-on: ubuntu-latest
    needs: [build, security]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39C048B2FF59452F9613463239824624 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0994BCA96630443BB4B8D46319B867CD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_115D8A1EAFB5485E96F15FA5CD4BB615 }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Resolve database configuration
        shell: bash
        env:
          ACTIONS_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ACTIONS_MONGODB_DB: ${{ vars.MONGODB_DB }}
        run: |
          set -euo pipefail
          resource_group="$(az webapp list --query "[?name=='quizguru-backend'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ] || [ "$resource_group" = "null" ]; then
            echo "::error::Azure Web App quizguru-backend was not found in the logged-in subscription"
            exit 1
          fi
          mongodb_uri="$ACTIONS_MONGODB_URI"
          mongodb_db="$ACTIONS_MONGODB_DB"
          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            mongodb_uri="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_URI'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="$(az webapp config appsettings list --name quizguru-backend --resource-group "$resource_group" --query "[?name=='MONGODB_DB'].value | [0]" --output tsv)"
          fi
          if [ -z "$mongodb_db" ] || [ "$mongodb_db" = "null" ]; then
            mongodb_db="quizDB"
          fi

          if [ -z "$mongodb_uri" ] || [ "$mongodb_uri" = "null" ]; then
            echo "::error::MONGODB_URI is missing from both GitHub Actions secrets and Azure Web App settings"
            exit 1
          fi
          echo "::add-mask::$mongodb_uri"
          echo "MONGODB_URI=$mongodb_uri" >> "$GITHUB_ENV"
          echo "MONGODB_DB=$mongodb_db" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$resource_group" >> "$GITHUB_ENV"

      - name: Apply database migrations before release
        run: npm run db:migrate

      - name: Configure Free F1 quiz-only runtime
        shell: bash
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --name quizguru-backend \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "RELEASE_ID=$RELEASE_ID" \
              "QUIZ_ONLY_MODE=true" \
              "RUN_EMBEDDED_WORKERS=false" \
              "PROCESS_ROLE=api" \
            --output none
          az webapp config set \
            --name quizguru-backend \
            --resource-group "$RESOURCE_GROUP" \
            --always-on false \
            --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'quizguru-backend'
          slot-name: 'Production'
          package: .
