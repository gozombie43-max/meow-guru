name: Continuous Verification & Quality Gate

on:
  workflow_call:
    inputs:
      verification_only:
        description: Prevent reusable verification from deploying production
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy the verified main commit to production
        type: boolean
        default: false
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '30 20 * * *'

# Superseded development runs can stop. Main/manual runs keep their deployment gates.
concurrency:
  group: verification-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  policy:
    name: Verification Policy
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.policy.outputs.full_validation }}
      lighthouse: ${{ steps.policy.outputs.lighthouse }}
      deploy_backend: ${{ steps.policy.outputs.deploy_backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify workflow routing policy
        run: node --test scripts/ci-policy.test.mjs scripts/ci-gate.test.mjs
      - name: Select verification and deployment scope
        id: policy
        env:
          VERIFICATION_ONLY: ${{ inputs.verification_only }}
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
        run: node scripts/ci-policy.mjs

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify Next lint directory matching and rules
        run: npm run check:lint-tooling --workspace frontend

      - name: Shared HTTP contracts and backend typecheck
        run: npm run typecheck --workspace @meow/contracts && npm run build --workspace backend

      - name: Frontend TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend ESLint
        working-directory: ./frontend
        run: npm run lint

  frontend-tests:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace frontend

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --workspace backend --include-workspace-root=false

      - name: Verify backend app and training route without optional integration credentials
        working-directory: ./backend
        run: node scripts/verify-app-no-optional-integrations.js

      - name: Verify OpenTelemetry ESM preload and local export
        working-directory: ./backend
        run: node scripts/verify-tracing-runtime.js --with-mongo

      - name: Validate Prometheus rules
        run: |
          docker run --rm --volume "$PWD/backend/observability:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules/slo-rules.yml
          docker run --rm --volume "$PWD/backend/observability:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /rules/slo-rules.test.yml

      - name: Run Backend Tests (Vitest)
        working-directory: ./backend
        run: npm run lint && npm run test:coverage

      - name: Real Redis queue, counters and cache subscriber recovery
        working-directory: ./backend
        env:
          REDIS_TEST_URL: redis://127.0.0.1:16379
        run: npm test -- infrastructure/__tests__/redisReliability.integration.test.js infrastructure/__tests__/redisCorrectness.integration.test.js infrastructure/__tests__/queueAdmission.integration.test.js

      - name: Install disposable Redis fault-test executable
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Two API outage, restore and worker crash tests (owned local services)
        working-directory: ./backend
        env:
          REDIS_FAULT_TEST_BIN: /usr/bin/redis-server
        run: npm test -- infrastructure/__tests__/redisOperational.integration.test.js

      - name: Authenticated training load smoke (isolated local database)
        working-directory: ./backend
        env:
          TRAINING_LOAD_STAGES: '1,5'
          TRAINING_LOAD_SCENARIOS: 'section-mathematics,adaptive-all,mission-all'
        run: npm run test:load:training

      - name: Pagination benchmark (isolated local database)
        id: pagination_benchmark
        working-directory: ./backend
        env:
          PAGINATION_BENCH_REPORT: ${{ runner.temp }}/pagination-benchmark.json
        run: npm run test:benchmark:pagination

      - name: Upload raw benchmark evidence
        if: ${{ !cancelled() && steps.pagination_benchmark.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pagination-benchmark
          path: ${{ runner.temp }}/pagination-benchmark.json
          retention-days: 14
          if-no-files-found: error

  security-and-vulnerability-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Audit Backend Dependencies
        run: npm audit --workspace backend --audit-level=high

      - name: Audit Frontend Dependencies
        run: npm audit --workspace frontend --audit-level=high

  build-and-analyze:
    name: Production Build & Bundle Report
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:3111
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Build contracts, backend and production frontend
        run: npm run build
      - name: Enforce entry JavaScript budgets
        working-directory: ./frontend
        run: npm run check:performance
      - name: Install Chromium
        run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - name: Shared interface and design contract
        working-directory: ./frontend
        run: npm run check:interface
      - name: Upload build output size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextjs-build-report
          path: frontend/.next/diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  browser-smoke:
    name: Development Browser Smoke
    needs: policy
    if: needs.policy.outputs.full_validation == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: http://127.0.0.1:3111
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - name: Authenticated assessment and resource smoke on desktop and mobile
        working-directory: ./frontend
        run: npm run test:e2e -- assessment.spec.ts resource.spec.ts --forbid-only --reporter=line,html
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  browser-regression:
    name: Browser Regression (${{ matrix.project }})
    needs: policy
    if: needs.policy.outputs.full_validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      API_URL: http://127.0.0.1:3111
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - name: Run full project with its own backend and database fixture
        working-directory: ./frontend
        run: npm run test:e2e -- --project=${{ matrix.project }} --forbid-only --reporter=line,html
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regression-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse Performance Report
    needs: policy
    if: needs.policy.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: http://127.0.0.1:3111
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@19ae4b339ee18925ab85cf12c1041150ea4a44c8 # v1
        with:
          # LHCI 0.15/Lighthouse 12 is trace-compatible with this Chrome major.
          # Pin it so hosted-runner browser updates cannot silently break FCP collection.
          chrome-version: 131
      - name: Lighthouse performance budgets
        working-directory: ./frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun
          node scripts/check-lighthouse-routes.mjs
      - name: Upload Lighthouse evidence, including failed assertions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-report
          path: |
            frontend/.lighthouseci/
            frontend/.next/diagnostics/lighthouse/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  fast-quality-gate:
    name: Fast Quality Gate
    if: always()
    needs: [policy, lint-and-typecheck, frontend-tests, backend-tests, security-and-vulnerability-scan, build-and-analyze, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require fast checks and the selected smoke coverage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs fast

  quality-gate:
    # Preserve the existing required check name and its full release protection.
    name: Quality Gate
    if: always()
    needs: [policy, fast-quality-gate, browser-regression, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the full suite whenever policy selects it
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs release

  deploy-backend:
    name: Deploy verified backend
    needs: [policy, quality-gate]
    if: needs.policy.outputs.deploy_backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/main_quizguru-backend.yml
    secrets: inherit
