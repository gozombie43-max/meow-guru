name: Continuous Verification & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --workspace frontend --include-workspace-root=false

      - name: Frontend TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test:run

      - name: Frontend ESLint
        working-directory: ./frontend
        run: npm run lint

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --workspace backend --include-workspace-root=false

      - name: Run Backend Tests (Vitest)
        working-directory: ./backend
        run: npm test

  security-and-vulnerability-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  build-and-analyze:
    name: Production Build & Bundle Report
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
      - name: Production Next.js build
        working-directory: ./frontend
        run: npm run build
      - name: Enforce entry JavaScript budgets
        working-directory: ./frontend
        run: npm run check:performance
      - name: Lighthouse performance budgets
        working-directory: ./frontend
        run: |
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun
          node scripts/check-lighthouse-routes.mjs
      - name: Upload build output size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-report
          path: frontend/.next/diagnostics/
          retention-days: 14
          if-no-files-found: ignore
