name: Continuous Verification & Quality Gate

on:
  workflow_call:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --workspace frontend --include-workspace-root=false

      - name: Frontend TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend ESLint
        working-directory: ./frontend
        run: npm run lint

  frontend-tests:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace frontend

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --workspace backend --include-workspace-root=false

      - name: Verify backend app module imports
        working-directory: ./backend
        run: node -e "import('./app.js')"

      - name: Run Backend Tests (Vitest)
        working-directory: ./backend
        run: npm run lint && npm run test:coverage

      - name: Authenticated training load smoke (isolated local database)
        working-directory: ./backend
        env:
          TRAINING_LOAD_STAGES: '1,5'
          TRAINING_LOAD_SCENARIOS: 'section-mathematics,adaptive-all,mission-all'
        run: npm run test:load:training

  security-and-vulnerability-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Backend Dependencies
        run: npm audit --workspace backend --audit-level=high

      - name: Audit Frontend Dependencies
        run: npm audit --workspace frontend --audit-level=high

  build-and-analyze:
    name: Production Build & Bundle Report
    runs-on: ubuntu-latest
    env:
      API_URL: http://127.0.0.1:10000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application and browser fixture dependencies
        run: npm ci
      - name: Production Next.js build
        working-directory: ./frontend
        run: npm run build
      - name: Enforce entry JavaScript budgets
        working-directory: ./frontend
        run: npm run check:performance
      - name: Install browser for assessment regression
        working-directory: ./frontend
        run: npm exec playwright install --with-deps chromium
      - name: Authenticated assessment browser regression
        working-directory: ./frontend
        run: npm run test:e2e
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@19ae4b339ee18925ab85cf12c1041150ea4a44c8 # v1
        with:
          # LHCI 0.15/Lighthouse 12 is trace-compatible with this Chrome major.
          # Pin it so hosted-runner browser updates cannot silently break FCP collection.
          chrome-version: 131
      - name: Lighthouse performance budgets
        working-directory: ./frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci autorun
          node scripts/check-lighthouse-routes.mjs
      - name: Upload build output size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextjs-build-report
          path: frontend/.next/diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [lint-and-typecheck, frontend-tests, backend-tests, security-and-vulnerability-scan, build-and-analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
