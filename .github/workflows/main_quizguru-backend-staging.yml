name: Build and deploy staging training backend

on:
  workflow_dispatch:
    inputs:
      sync_questions:
        description: 'Refresh staging question bank from isolated staging seed source (main branch only)'
        required: true
        default: false
        type: boolean

concurrency:
  group: quizguru-backend-staging
  cancel-in-progress: false

jobs:
  verification:
    # Reusable CI declares a production deployment job; this is its permission ceiling.
    # verification_only prevents that job from running in this staging workflow.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/ci-verify.yml
    with:
      verification_only: true
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked production dependencies
        run: npm ci --workspace backend --workspace @meow/contracts --include-workspace-root=false --omit=dev
      - name: Package staging runtime
        run: |
          node backend/scripts/materialize-runtime-workspaces.js
          node backend/scripts/verify-runtime-dependencies.js --deployment
          printf '%s' "${{ github.sha }}" > backend/RELEASE_ID
          tar --exclude='backend/.env*' --exclude='backend/coverage' --exclude='backend/uploads' \
            -czf release.tar.gz backend contracts node_modules package.json package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-node-app
          path: release.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: [build, verification]
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: Meowguru_staging_group
      STAGING_APP_SERVICE_PLAN: quizguru-stage-plan
      STAGING_MONGODB_DB: quizDB_staging
      STAGING_MONGODB_EXPECTED_HOST: quizguru-staging.c8bkump.mongodb.net
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-node-app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Extract and verify artifact
        run: |
          mkdir release
          tar -xzf release.tar.gz -C release
          cd release
          node backend/scripts/verify-runtime-dependencies.js --deployment
      - name: Validate staging database secret
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_MONGODB_URI" ] || { echo '::error::Set repository secret STAGING_MONGODB_URI'; exit 1; }
          [[ "$STAGING_MONGODB_URI" == *"quizguru-staging.c8bkump.mongodb.net"* ]] || {
            echo '::error::STAGING_MONGODB_URI does not point at the isolated Atlas staging cluster'; exit 1;
          }
      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39C048B2FF59452F9613463239824624 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0994BCA96630443BB4B8D46319B867CD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_115D8A1EAFB5485E96F15FA5CD4BB615 }}
      - name: Verify Azure RBAC for staging resource group
        shell: bash
        run: |
          set -euo pipefail
          subscription_id="$(az account show --query id --output tsv)"
          scope="/subscriptions/$subscription_id/resourceGroups/$AZURE_RESOURCE_GROUP"
          echo "AZURE_RESOURCE_GROUP_SCOPE=$scope" >> "$GITHUB_ENV"

          error_file="$(mktemp)"
          if ! resource_group_id="$(az group show --name "$AZURE_RESOURCE_GROUP" --query id --output tsv 2>"$error_file")"; then
            cat "$error_file" >&2 || true
            rm -f "$error_file"
            echo "::error title=Azure staging bootstrap required::GitHub OIDC cannot read '$AZURE_RESOURCE_GROUP'. Create that staging-only resource group once, then assign both 'Website Contributor' and 'Web Plan Contributor' to this service principal at scope '$scope'."
            exit 1
          fi
          rm -f "$error_file"

          if [ "${resource_group_id,,}" != "${scope,,}" ]; then
            echo "::error::Resolved unexpected Azure resource-group scope: $resource_group_id"
            exit 1
          fi
      - name: Provision isolated staging App Service
        shell: bash
        run: |
          set -euo pipefail
          app_name="quizguru-stage-${GITHUB_REPOSITORY_ID}"
          plan_name="$STAGING_APP_SERVICE_PLAN"

          fail_rbac() {
            local operation="$1"
            echo "::error title=Azure RBAC missing::$operation is not authorized at '$AZURE_RESOURCE_GROUP_SCOPE'. The GitHub OIDC service principal requires both 'Website Contributor' and 'Web Plan Contributor' on staging resource group '$AZURE_RESOURCE_GROUP'."
            exit 1
          }

          plan_error="$(mktemp)"
          if az appservice plan show --name "$plan_name" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>"$plan_error"; then
            :
          else
            if grep -Eqi 'AuthorizationFailed|does not have authorization|Forbidden' "$plan_error"; then
              cat "$plan_error" >&2
              rm -f "$plan_error"
              fail_rbac "Reading staging App Service plan"
            fi
            if ! grep -Eqi 'ResourceNotFound|could not be found|was not found|not found' "$plan_error"; then
              cat "$plan_error" >&2
              rm -f "$plan_error"
              echo '::error::Unexpected error while checking the staging App Service plan'
              exit 1
            fi
            rm -f "$plan_error"

            create_plan_error="$(mktemp)"
            if ! az appservice plan create \
              --name "$plan_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --sku F1 \
              --is-linux \
              --output none 2>"$create_plan_error"; then
              cat "$create_plan_error" >&2
              if grep -Eqi 'AuthorizationFailed|does not have authorization|Forbidden' "$create_plan_error"; then
                rm -f "$create_plan_error"
                fail_rbac "Creating staging App Service plan"
              fi
              rm -f "$create_plan_error"
              echo '::error::Failed to create the staging App Service plan'
              exit 1
            fi
            rm -f "$create_plan_error"
          fi

          sku="$(az appservice plan show --name "$plan_name" --resource-group "$AZURE_RESOURCE_GROUP" --query sku.name --output tsv)"
          case "$sku" in
            F1)
              ;;
            B1)
              echo '::warning title=Paid staging plan active::Staging App Service is temporarily using B1. Return quizguru-stage-plan to F1 when B1 testing is finished.'
              ;;
            *)
              echo "::error::Refusing unsupported staging plan SKU: $sku. Allowed SKUs are F1 and B1."
              exit 1
              ;;
          esac

          app_error="$(mktemp)"
          if az webapp show --name "$app_name" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>"$app_error"; then
            :
          else
            if grep -Eqi 'AuthorizationFailed|does not have authorization|Forbidden' "$app_error"; then
              cat "$app_error" >&2
              rm -f "$app_error"
              fail_rbac "Reading staging Web App"
            fi
            if ! grep -Eqi 'ResourceNotFound|could not be found|was not found|not found' "$app_error"; then
              cat "$app_error" >&2
              rm -f "$app_error"
              echo '::error::Unexpected error while checking the staging Web App'
              exit 1
            fi
            rm -f "$app_error"

            create_app_error="$(mktemp)"
            if ! az webapp create \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --plan "$plan_name" \
              --runtime 'NODE|22-lts' \
              --output none 2>"$create_app_error"; then
              cat "$create_app_error" >&2
              if grep -Eqi 'AuthorizationFailed|does not have authorization|Forbidden' "$create_app_error"; then
                rm -f "$create_app_error"
                fail_rbac "Creating staging Web App"
              fi
              rm -f "$create_app_error"
              echo '::error::Failed to create the staging Web App'
              exit 1
            fi
            rm -f "$create_app_error"
          fi

          host="$(az webapp show --name "$app_name" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostName --output tsv)"
          [ -n "$host" ] || { echo '::error::Azure returned an empty staging hostname'; exit 1; }
          echo "RESOURCE_GROUP=$AZURE_RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "STAGING_APP_NAME=$app_name" >> "$GITHUB_ENV"
          echo "STAGING_APP_HOST=$host" >> "$GITHUB_ENV"
      - name: Refuse question sync from untrusted non-main branch
        if: ${{ inputs.sync_questions && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Refusing to run staging question sync from non-main ref ($GITHUB_REF)."
          exit 1
      - name: Resolve isolated staging question seed source
        if: ${{ inputs.sync_questions && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          STAGING_QUESTION_SOURCE_URI: ${{ secrets.STAGING_QUESTION_SOURCE_MONGODB_URI }}
          STAGING_QUESTION_SOURCE_DB: ${{ vars.STAGING_QUESTION_SOURCE_MONGODB_DB }}
        run: |
          set -euo pipefail
          source_uri="${STAGING_QUESTION_SOURCE_URI:-}"
          source_db="${STAGING_QUESTION_SOURCE_DB:-quizDB_seed}"

          if [ -z "$source_uri" ] || [ "$source_uri" = "null" ]; then
            echo '::error title=Staging question seed source unavailable::Set repository secret STAGING_QUESTION_SOURCE_MONGODB_URI (never production MONGODB_URI).'
            exit 1
          fi
          if [[ "$source_db" =~ [Ss][Tt][Aa][Gg][Ii][Nn][Gg] ]]; then
            echo "::error::Refusing question seed source database with staging target name: $source_db"
            exit 1
          fi

          echo "::add-mask::$source_uri"
          echo "SOURCE_MONGODB_URI=$source_uri" >> "$GITHUB_ENV"
          echo "SOURCE_MONGODB_DB=$source_db" >> "$GITHUB_ENV"
      - name: Refresh staging question bank
        if: ${{ inputs.sync_questions && github.ref == 'refs/heads/main' }}
        working-directory: release
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
        run: node backend/scripts/sync-training-staging-questions.js
      - name: Clear staging question seed source from runner environment
        if: ${{ always() && inputs.sync_questions }}
        shell: bash
        run: |
          echo 'SOURCE_MONGODB_URI=' >> "$GITHUB_ENV"
          echo 'SOURCE_MONGODB_DB=' >> "$GITHUB_ENV"
      - name: Apply staging database migrations
        working-directory: release
        env:
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DB: quizDB_staging
        run: npm run db:migrate --workspace backend

      - name: Persist staging public catalogs before release
        working-directory: release
        env:
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DB: ${{ env.STAGING_MONGODB_DB }}
        run: |
          normalized_keys="$(az webapp config appsettings list --name "$STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?name=='QUESTIONS_NORMALIZED_KEYS'].value | [0]" --output tsv)"
          export QUESTIONS_NORMALIZED_KEYS="${normalized_keys:-false}"
          npm run db:initialize-public-catalog --workspace backend
      - name: Configure isolated staging runtime
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          STAGING_CONVEX_JWT_PRIVATE_KEY_B64: ${{ secrets.STAGING_CONVEX_JWT_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          : "${STAGING_MONGODB_URI:?Missing STAGING_MONGODB_URI secret}"
          : "${STAGING_CONVEX_JWT_PRIVATE_KEY_B64:?Missing STAGING_CONVEX_JWT_PRIVATE_KEY_B64 secret}"
          : "${STAGING_APP_NAME:?Missing STAGING_APP_NAME}"
          : "${STAGING_APP_HOST:?Missing STAGING_APP_HOST}"
          : "${RESOURCE_GROUP:?Missing RESOURCE_GROUP}"

          jwt_secret="$(openssl rand -hex 32)"
          refresh_secret="$(openssl rand -hex 32)"

          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$refresh_secret"
          echo "::add-mask::$STAGING_CONVEX_JWT_PRIVATE_KEY_B64"

          umask 077
          settings_file="$(mktemp "${RUNNER_TEMP:-/tmp}/meow-staging-settings.XXXXXX.json")"
          trap 'rm -f "$settings_file"' EXIT

          jq -n \
            --arg mongoUri "$STAGING_MONGODB_URI" \
            --arg jwtSecret "$jwt_secret" \
            --arg refreshSecret "$refresh_secret" \
            --arg googleCallback "https://${STAGING_APP_HOST}/auth/google/callback" \
            --arg convexIssuer "https://${STAGING_APP_HOST}/auth/convex" \
            --arg convexAudience "meow-convex-staging" \
            --arg convexKeyId "meow-convex-3b3030964606" \
            --arg convexPrivateKey "$STAGING_CONVEX_JWT_PRIVATE_KEY_B64" \
            '[
              {"name":"MONGODB_URI","value":$mongoUri},
              {"name":"MONGODB_DB","value":"quizDB_staging"},
              {"name":"QUIZ_ONLY_MODE","value":"true"},
              {"name":"RUN_EMBEDDED_WORKERS","value":"false"},
              {"name":"DEPLOYMENT_ENVIRONMENT","value":"staging"},
              {"name":"PROCESS_ROLE","value":"api"},
              {"name":"NODE_ENV","value":"production"},
              {"name":"TRAINING_INDEXED_QUESTIONS","value":"true"},
              {"name":"TRAINING_LOCAL_INGRESS","value":"true"},
              {"name":"JWT_SECRET","value":$jwtSecret},
              {"name":"REFRESH_TOKEN_SECRET","value":$refreshSecret},
              {"name":"FRONTEND_URL","value":"https://example.invalid"},
              {"name":"GOOGLE_CLIENT_ID","value":"staging-disabled"},
              {"name":"GOOGLE_CLIENT_SECRET","value":"staging-disabled"},
              {"name":"GOOGLE_CALLBACK_URL","value":$googleCallback},
              {"name":"CONVEX_JWT_ISSUER","value":$convexIssuer},
              {"name":"CONVEX_JWT_AUDIENCE","value":$convexAudience},
              {"name":"CONVEX_JWT_KEY_ID","value":$convexKeyId},
              {"name":"CONVEX_JWT_PRIVATE_KEY_B64","value":$convexPrivateKey}
            ]' > "$settings_file"

          chmod 600 "$settings_file"

          az webapp config appsettings set \
            --name "$STAGING_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "@$settings_file" \
            --output none

          az webapp config set \
            --name "$STAGING_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --startup-file 'npm --workspace backend start' \
            --always-on false \
            --output none
      - name: Deploy staging backend
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ env.STAGING_APP_NAME }}
          slot-name: Production
          package: release
      - name: Verify staging release readiness
        shell: bash
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail

          site_id="$(az webapp show --name "$STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id --output tsv)"
          sku="$(az appservice plan show --name "$STAGING_APP_SERVICE_PLAN" --resource-group "$RESOURCE_GROUP" --query sku.name --output tsv)"
          quota_recovery_used=false

          print_state_and_quotas() {
            local state
            state="$(az webapp show --name "$STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" --query state --output tsv 2>/dev/null || echo unknown)"
            echo "Staging App Service state: $state; plan SKU: $sku"
            if [ "$sku" = 'F1' ]; then
              az rest --method get \
                --url "https://management.azure.com${site_id}/usages?api-version=2025-03-01" \
                --query "value[].{Quota:name.localizedValue,Current:currentValue,Limit:limit,Unit:unit,NextReset:nextResetTime}" \
                --output table || true
            fi
          }

          recover_after_free_quota() {
            local quota_file reset now_epoch reset_epoch wait_seconds
            quota_file="$(mktemp)"
            if az rest --method get \
              --url "https://management.azure.com${site_id}/usages?api-version=2025-03-01" \
              --output json > "$quota_file" 2>/dev/null; then
              echo 'Free-tier quota snapshot before recovery:'
              jq -r '.value[] | [(.name.localizedValue // .name.value // "unknown"), (.currentValue|tostring), (.limit|tostring), (.unit // ""), (.nextResetTime // "")] | @tsv' "$quota_file" \
                | column -t -s $'\t' || cat "$quota_file"

              reset="$(jq -r '[.value[] | select((.limit // 0) > 0 and (.currentValue // 0) >= (.limit // 0)) | .nextResetTime | select(type == "string" and length > 0)] | sort | .[0] // empty' "$quota_file")"
            else
              reset=''
            fi
            rm -f "$quota_file"

            if [ -n "$reset" ]; then
              now_epoch="$(date -u +%s)"
              reset_epoch="$(date -u -d "$reset" +%s 2>/dev/null || echo 0)"
              if [ "$reset_epoch" -gt "$now_epoch" ]; then
                wait_seconds=$((reset_epoch - now_epoch + 20))
                if [ "$wait_seconds" -gt 600 ]; then
                  echo "::error title=F1 quota exhausted::The staging app hit a Free-tier quota whose next reset is $reset. This is not a transient cold-start failure; wait for the quota reset or use a non-Free staging plan."
                  return 2
                fi
                [ "$wait_seconds" -ge 30 ] || wait_seconds=30
              else
                wait_seconds=30
              fi
            else
              # CPU-short quota is a five-minute window. When Azure usage data is delayed,
              # wait one complete window before trying to start the app again.
              wait_seconds=330
            fi

            echo "F1 quota recovery: waiting ${wait_seconds}s before restarting staging."
            sleep "$wait_seconds"
            az webapp start --name "$STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" --output none
            sleep 15
          }

          # A previous failed run can leave the staging app stopped.
          az webapp start --name "$STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" --output none || true

          for attempt in $(seq 1 30); do
            : > health.json
            status="$(curl --silent --show-error --max-time 20 --output health.json --write-out '%{http_code}' "https://$STAGING_APP_HOST/api/health")" || status='transport-error'

            if [ "$status" = '200' ] && jq -e --arg release "$EXPECTED_RELEASE" '.ok == true and .state == "ready" and .releaseId == $release and .environment == "staging"' health.json >/dev/null; then
              cat health.json
              print_state_and_quotas
              exit 0
            fi

            echo "Readiness attempt $attempt/30: HTTP $status"

            if [ "$status" = '403' ] && grep -Eqi 'web app is stopped|site disabled|quota' health.json; then
              print_state_and_quotas
              if [ "$sku" != 'F1' ]; then
                echo '::error::Staging stopped unexpectedly on a non-F1 plan.'
                exit 1
              fi
              if [ "$quota_recovery_used" = true ]; then
                echo '::error title=F1 staging remains stopped::The app is still stopped after one complete quota recovery cycle. Inspect the quota table above; do not hide this by repeatedly restarting the app.'
                exit 1
              fi
              quota_recovery_used=true
              recover_after_free_quota || exit $?
              continue
            fi

            sleep 10
          done

          cat health.json || true
          print_state_and_quotas
          echo '::error::Staging release failed readiness verification'
          exit 1
      - name: Verify staging Convex authentication endpoints
        shell: bash
        run: |
          set -euo pipefail

          jwks_file="$(mktemp)"
          token_file="$(mktemp)"
          trap 'rm -f "$jwks_file" "$token_file"' EXIT

          jwks_status="$(curl --silent --show-error --max-time 20 \
            --output "$jwks_file" \
            --write-out '%{http_code}' \
            "https://${STAGING_APP_HOST}/auth/convex/.well-known/jwks.json")" \
            || jwks_status="transport-error"

          if [ "$jwks_status" != "200" ]; then
            echo "::error::Convex JWKS endpoint returned HTTP $jwks_status"
            cat "$jwks_file"
            exit 1
          fi

          if ! jq -e \
            --arg kid "meow-convex-3b3030964606" \
            '.keys | any(.[];
              .kid == $kid and
              .alg == "ES256" and
              .kty == "EC" and
              .crv == "P-256" and
              (.key_ops | index("verify") != null)
            )' "$jwks_file" >/dev/null; then
            echo "::error::Convex JWKS key validation failed"
            exit 1
          fi

          token_status="$(curl --silent --show-error --max-time 20 \
            --output "$token_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${STAGING_APP_HOST}/auth/convex/token")" \
            || token_status="transport-error"

          if [ "$token_status" != "401" ]; then
            echo "::error::Unauthenticated Convex token request returned HTTP $token_status instead of 401"
            cat "$token_file"
            exit 1
          fi

          echo "PASS: Convex JWKS is publicly accessible."
          echo "PASS: Expected ES256 public key is published."
          echo "PASS: Unauthenticated token issuance is rejected."
