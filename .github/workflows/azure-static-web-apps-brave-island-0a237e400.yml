name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - name: Build And Deploy (Pull Request)
        if: github.event_name == 'pull_request'
        id: builddeploy_pr
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_ISLAND_0A237E400 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"
          api_location: ""
          output_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}
          deployment_environment: "preview"
        env:
          NEXT_PUBLIC_API_URL: https://quizguru-backend-hsb0enbnhbbhh5ek.centralindia-01.azurewebsites.net
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          NEXT_PUBLIC_AZURE_TRANSLATOR_ENDPOINT: https://api.cognitive.microsofttranslator.com
          NEXT_PUBLIC_AZURE_TRANSLATOR_REGION: eastasia

      - name: Build And Deploy (Push)
        if: github.event_name == 'push'
        id: builddeploy_push
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_ISLAND_0A237E400 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"
          api_location: ""
          output_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}
        env:
          NEXT_PUBLIC_API_URL: https://quizguru-backend-hsb0enbnhbbhh5ek.centralindia-01.azurewebsites.net
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          NEXT_PUBLIC_AZURE_TRANSLATOR_ENDPOINT: https://api.cognitive.microsofttranslator.com
          NEXT_PUBLIC_AZURE_TRANSLATOR_REGION: eastasia

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_ISLAND_0A237E400 }}
          app_location: "./frontend"
          action: "close"
          deployment_environment: "preview"
