# Meow API reverse proxy — Ubuntu Nginx conf.d file.
# Replace api.example.com with the DNS name pointed at this VPS.
# Backend must be reachable locally at 127.0.0.1:10000.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# REST/API traffic: switch this to multiple healthy nodes when ready.
upstream meow_api_http {
    least_conn;
    server 127.0.0.1:10000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Socket.IO polling fallback needs session affinity across API replicas.
# With one node, this is equivalent to a single upstream.
upstream meow_api_socket {
    ip_hash;
    server 127.0.0.1:10000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 60s;

    access_log /var/log/nginx/meow-api.access.log;
    error_log  /var/log/nginx/meow-api.error.log warn;

    # Let's Encrypt HTTP-01 challenge files.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Public liveness probe. Does not disclose dependency details.
    location = /live {
        proxy_pass http://meow_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Readiness includes dependency state; keep it local to the VPS.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://meow_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Metrics are already token-gated in the app; also keep the endpoint private.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://meow_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Meow image upload routes allow up to 20 files x 20 MiB each.
    # Stream the request to Node rather than buffering the full multipart body in Nginx.
    location ^~ /api/upload/ {
        client_max_body_size 410m;
        client_body_timeout 300s;
        proxy_request_buffering off;

        proxy_pass http://meow_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Socket.IO: supports WebSocket upgrade and polling fallback.
    location ^~ /socket.io/ {
        proxy_pass http://meow_api_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # All remaining REST/API routes.
    location / {
        proxy_pass http://meow_api_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
