groups:
  - name: meow-service-objectives
    rules:
      - record: meow:availability_error_ratio:5m
        expr: (sum(rate(meow_http_requests_total{status=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate(meow_http_requests_total[5m])), 0.001)
      - record: meow:availability_error_ratio:1h
        expr: (sum(rate(meow_http_requests_total{status=~"5.."}[1h])) or vector(0)) / clamp_min(sum(rate(meow_http_requests_total[1h])), 0.001)
      - record: meow:availability_error_ratio:30m
        expr: (sum(rate(meow_http_requests_total{status=~"5.."}[30m])) or vector(0)) / clamp_min(sum(rate(meow_http_requests_total[30m])), 0.001)
      - record: meow:availability_error_ratio:6h
        expr: (sum(rate(meow_http_requests_total{status=~"5.."}[6h])) or vector(0)) / clamp_min(sum(rate(meow_http_requests_total[6h])), 0.001)
      - alert: MeowFastErrorBudgetBurn
        expr: meow:availability_error_ratio:1h > 14.4 * 0.001 and meow:availability_error_ratio:5m > 14.4 * 0.001
        labels: { severity: page }
        annotations: { summary: 'API availability consumes the 99.9% monthly budget rapidly' }
      - alert: MeowSlowErrorBudgetBurn
        expr: meow:availability_error_ratio:6h > 6 * 0.001 and meow:availability_error_ratio:30m > 6 * 0.001
        labels: { severity: ticket }
        annotations: { summary: 'API availability has sustained error budget consumption' }
      - record: meow:get_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_http_duration_seconds_bucket{method="GET"}[5m])))
      - record: meow:mongo_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_dependency_duration_seconds_bucket{dependency="mongo"}[5m])))
      - record: meow:authorization_mongo:qps
        expr: sum(rate(meow_mongo_commands_total{purpose="authorization"}[5m]))
      - record: meow:authorization_mongo:p95
        expr: histogram_quantile(0.95, sum by (le, collection) (rate(meow_mongo_command_duration_seconds_bucket{purpose="authorization",outcome="success"}[5m])))
      - record: meow:authorization_burst:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_auth_validation_burst_duration_seconds_bucket{outcome="success"}[5m])))
      - record: meow:answer_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_http_duration_seconds_bucket{operation="answer"}[5m])))
      - record: meow:create_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_http_duration_seconds_bucket{route="/api/training/sessions",method="POST"}[5m])))
      - record: meow:redis_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_dependency_duration_seconds_bucket{dependency="redis"}[5m])))
      - record: meow:training_create_stage:p95
        expr: histogram_quantile(0.95, sum by (le, stage) (rate(meow_training_create_stage_duration_seconds_bucket{outcome="success"}[5m])))
      - alert: MeowBackendUnreachable
        expr: probe_success{job="meow-uptime"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'External backend liveness/readiness probe failed' }
      - alert: MeowExternalProbeMissing
        expr: absent(up{job="meow-uptime"}) or up{job="meow-uptime"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: 'External probe coverage is unavailable' }
      - alert: MeowMetricsMissing
        expr: absent(up{job="meow-backend"}) or up{job="meow-backend"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: 'Backend scrape is unavailable; inspect /live and /health' }
      - record: meow:write_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_http_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])))
      - record: meow:mongo_command_latency:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(meow_mongo_command_duration_seconds_bucket{outcome="success"}[5m])))
      - record: meow:nodejs_heap_growth_bytes_per_second:30m
        expr: deriv(meow_nodejs_heap_size_used_bytes[30m])
      - alert: MeowReadApiLatencyHigh
        expr: meow:get_latency:p95 > 0.5
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Read API (GET) p95 latency exceeded 500ms for 5m' }
      - alert: MeowWriteApiLatencyHigh
        expr: meow:write_latency:p95 > 0.8
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Write API (POST/PUT/PATCH/DELETE) p95 latency exceeded 800ms for 5m' }
      - alert: MeowMongoPoolSaturation
        expr: max(meow_mongo_pool_waiting) > 5
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'MongoDB connection pool checkout waiters exceeded 5 for 2m' }
      - alert: MeowMongoCommandLatencyHigh
        expr: meow:mongo_command_latency:p95 > 0.25
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: 'MongoDB command p95 latency exceeded 250ms for 5m' }
      - alert: MeowValkeyCircuitOpen
        expr: max(meow_redis_circuit_state) > 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: 'Valkey/Redis cache circuit breaker is open or half-open for 2m' }
      - alert: MeowValkeyLatencyHigh
        expr: meow:redis_latency:p95 > 0.1
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: 'Valkey/Redis dependency p95 latency exceeded 100ms for 5m' }
      - alert: MeowProcessRssSaturation
        expr: meow_process_resident_memory_bytes > 1258291200
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Backend process RSS memory exceeded 1.2 GiB for 5m' }
      - alert: MeowSustainedHeapGrowth
        expr: meow:nodejs_heap_growth_bytes_per_second:30m > 65536 and meow_nodejs_heap_size_used_bytes > 536870912
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: 'Node.js heap usage shows sustained growth (>64 KiB/s above 512 MiB for 15m)' }
      - alert: MeowEventLoopLagHigh
        expr: max by (instance) (meow_nodejs_eventloop_lag_p99_seconds) > 0.1
        for: 3m
        labels: { severity: page }
        annotations: { summary: 'Node.js event-loop p99 lag exceeded 100ms for 3m' }
