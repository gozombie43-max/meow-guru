rule_files:
  - slo-rules.yml
evaluation_interval: 1m
tests:
  - name: authorization rates and histograms aggregate both API replicas
    interval: 1m
    input_series:
      - series: 'meow_mongo_commands_total{collection="users",command="find",purpose="authorization",outcome="success",instance="a"}'
        values: '0+120x20'
      - series: 'meow_mongo_commands_total{collection="authSessions",command="find",purpose="authorization",outcome="success",instance="a"}'
        values: '0+120x20'
      - series: 'meow_mongo_commands_total{collection="users",command="find",purpose="authorization",outcome="success",instance="b"}'
        values: '0+120x20'
      - series: 'meow_mongo_commands_total{collection="authSessions",command="find",purpose="authorization",outcome="success",instance="b"}'
        values: '0+120x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="a",le="0.01"}'
        values: '0+108x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="a",le="0.025"}'
        values: '0+120x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="a",le="+Inf"}'
        values: '0+120x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="b",le="0.01"}'
        values: '0+108x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="b",le="0.025"}'
        values: '0+120x20'
      - series: 'meow_mongo_command_duration_seconds_bucket{collection="users",command="find",purpose="authorization",outcome="success",instance="b",le="+Inf"}'
        values: '0+120x20'
    promql_expr_test:
      - expr: meow:authorization_mongo:qps
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="meow:authorization_mongo:qps"}'
            value: 8
      - expr: meow:authorization_mongo:p95
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="meow:authorization_mongo:p95",collection="users"}'
            value: 0.01749999999999999
  - name: external failure catches an unreachable backend
    interval: 1m
    input_series:
      - series: 'probe_success{job="meow-uptime",instance="https://fixture.invalid/health"}'
        values: '0x10'
      - series: 'up{job="meow-uptime"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: MeowBackendUnreachable
        exp_alerts:
          - exp_labels: { severity: page, job: meow-uptime, instance: 'https://fixture.invalid/health' }
            exp_annotations: { summary: 'External backend liveness/readiness probe failed' }
      - eval_time: 6m
        alertname: MeowExternalProbeMissing
        exp_alerts: []
  - name: missing external coverage raises an alert
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: MeowExternalProbeMissing
        exp_alerts:
          - exp_labels: { severity: ticket, job: meow-uptime }
            exp_annotations: { summary: 'External probe coverage is unavailable' }
  - name: healthy traffic preserves the error budget
    interval: 1m
    input_series:
      - series: 'meow_http_requests_total{method="GET",route="/api/training/dashboard",status="200"}'
        values: '0+999x360'
      - series: 'meow_http_requests_total{method="GET",route="/api/training/dashboard",status="500"}'
        values: '0+1x360'
      - series: 'up{job="meow-backend",instance="fixture"}'
        values: '1x360'
    alert_rule_test:
      - eval_time: 6h
        alertname: MeowFastErrorBudgetBurn
        exp_alerts: []
      - eval_time: 6h
        alertname: MeowSlowErrorBudgetBurn
        exp_alerts: []
      - eval_time: 6h
        alertname: MeowMetricsMissing
        exp_alerts: []
  - name: sustained failures burn both windows
    interval: 1m
    input_series:
      - series: 'meow_http_requests_total{method="POST",route="/api/training/sessions",status="200"}'
        values: '0+98x360'
      - series: 'meow_http_requests_total{method="POST",route="/api/training/sessions",status="500"}'
        values: '0+2x360'
      - series: 'up{job="meow-backend",instance="fixture"}'
        values: '1x360'
    alert_rule_test:
      - eval_time: 6h
        alertname: MeowFastErrorBudgetBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: 'API availability consumes the 99.9% monthly budget rapidly' }
      - eval_time: 6h
        alertname: MeowSlowErrorBudgetBurn
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: 'API availability has sustained error budget consumption' }
